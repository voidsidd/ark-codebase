<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Ark Core · Events</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/><link rel="stylesheet" href="/styles.css"/></head>
<body><div class="app"><aside class="nav"><div class="brand"><h1>ARK CORE</h1><p>SOC Intelligence Layer</p></div><div class="nav-links"><a class="nav-item active" href="/events.html">Events</a><a class="nav-item" href="/reports.html">Reports</a><a class="nav-item" href="/memory.html">Memory Graph</a><a class="nav-item" href="/telemetry.html">Telemetry</a><a class="nav-item" href="/video.html">Video Feeds</a><a class="nav-item" href="/processing.html">Processing</a></div><div class="quick"><h3>Shortcuts</h3><div class="hotkey"><span>Run next</span><span class="kbd">R</span></div><div class="hotkey"><span>Run all</span><span class="kbd">Shift+R</span></div></div></aside>
