name: CI — Lint, Type-check & Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ─────────────────────────────────────────────
  # FRONTEND  (React + Vite + TypeScript + ESLint)
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      # ESLint — use npx to avoid binary permission issues from Windows-committed node_modules
      - name: Lint (ESLint)
        run: npx eslint . --ext ts,tsx --report-unused-disable-directives --max-warnings 0

      - name: Type-check (tsc)
        run: npx tsc --noEmit

      # Vite production build — validates bundling succeeds
      - name: Build
        env:
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN || 'ci-placeholder' }}
        run: npx vite build

      - name: Security audit (high/critical only)
        run: npm audit --audit-level=high
        continue-on-error: true  # warn but don't block — fix progressively

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ─────────────────────────────────────────────
  # BACKEND  (Node.js / Express)
  # ─────────────────────────────────────────────
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Syntax check (node --check)
        run: node --check server.js

      - name: Security audit (high/critical only)
        run: npm audit --audit-level=high
        continue-on-error: true

  # ─────────────────────────────────────────────
  # PYTHON AI ENGINE  (Flake8 + Syntax check)
  # ─────────────────────────────────────────────
  python:
    name: Python AI Engine CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Syntax check all Python files
        run: python -m py_compile $(find backend/ai_engine -name "*.py") && echo "✅ All Python files have valid syntax"

      - name: Lint with flake8
        run: |
          flake8 backend/ai_engine \
            --max-line-length=120 \
            --extend-ignore=E501,W503,E203 \
            --exclude=__pycache__,.venv,venv
